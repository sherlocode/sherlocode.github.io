# Costruisce il sito con Astro e lo pubblica su GitHub Pages
# a ogni modifica del branch main (quindi anche a ogni salvataggio da Pages CMS).
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permette di rilanciarlo a mano dalla scheda Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Se salvi più volte di fila, conta solo l'ultima pubblicazione
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Costruisci il sito
        run: npm run build
        env:
          # Indirizzo pubblico: https://<tuo-username>.github.io
          # Se usi un dominio tuo, sostituisci con es. https://www.tuodominio.it
          SITE: https://${{ github.repository_owner }}.github.io

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
