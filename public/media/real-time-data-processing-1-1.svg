<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" role="img" aria-labelledby="t">
  <title id="t">Real-time data processing</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#CDFF3A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#CDFF3A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#CDFF3A" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#CDFF3A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#CDFF3A"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDFF3A" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#CDFF3A" stop-opacity="0"/>
    </linearGradient>
    <!-- Event streams entering the processor -->
    <path id="s1" d="M60 150 C 200 150, 300 300, 520 313"/>
    <path id="s2" d="M60 313 L 520 313"/>
    <path id="s3" d="M60 476 C 200 476, 300 326, 520 313"/>
  </defs>

  <circle cx="600" cy="313" r="300" fill="url(#glow)"/>

  <!-- Event sources -->
  <g fill="#101013" stroke="#CDFF3A" stroke-width="3">
    <circle cx="52" cy="150" r="14"/>
    <circle cx="52" cy="313" r="14"/>
    <circle cx="52" cy="476" r="14"/>
  </g>

  <!-- Streams -->
  <g fill="none" stroke-linecap="round">
    <use href="#s1" stroke="#2A2A2E" stroke-width="3"/>
    <use href="#s2" stroke="#2A2A2E" stroke-width="3"/>
    <use href="#s3" stroke="#2A2A2E" stroke-width="3"/>
    <use href="#s1" stroke="url(#fade)" stroke-width="3" stroke-dasharray="2 18"/>
    <use href="#s2" stroke="url(#fade)" stroke-width="3" stroke-dasharray="2 18"/>
    <use href="#s3" stroke="url(#fade)" stroke-width="3" stroke-dasharray="2 18"/>
  </g>

  <!-- Events moving along the streams -->
  <g>
    <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#F2F2F0">
      <animateMotion dur="3.2s" repeatCount="indefinite" rotate="0"><mpath href="#s1"/></animateMotion>
    </rect>
    <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#CDFF3A">
      <animateMotion dur="2.6s" begin="-1s" repeatCount="indefinite"><mpath href="#s2"/></animateMotion>
    </rect>
    <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#2BFF88">
      <animateMotion dur="3.6s" begin="-2s" repeatCount="indefinite"><mpath href="#s3"/></animateMotion>
    </rect>
    <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#F2F2F0" opacity="0.7">
      <animateMotion dur="2.6s" begin="-2.2s" repeatCount="indefinite"><mpath href="#s2"/></animateMotion>
    </rect>
    <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#CDFF3A" opacity="0.8">
      <animateMotion dur="3.2s" begin="-2.4s" repeatCount="indefinite"><mpath href="#s1"/></animateMotion>
    </rect>
    <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#F2F2F0" opacity="0.6">
      <animateMotion dur="3.6s" begin="-0.6s" repeatCount="indefinite"><mpath href="#s3"/></animateMotion>
    </rect>
  </g>

  <!-- Processor: stopwatch lens with a lightning bolt -->
  <g transform="translate(600 313)">
    <circle r="112" fill="#0A0A0B" stroke="#CDFF3A" stroke-width="14"/>
    <rect x="-22" y="-160" width="44" height="26" rx="6" fill="#CDFF3A"/>
    <rect x="-7" y="-138" width="14" height="16" fill="#CDFF3A"/>
    <g stroke="#3A3A3F" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-88" x2="0" y2="-74"/>
      <line x1="88" y1="0" x2="74" y2="0"/>
      <line x1="0" y1="88" x2="0" y2="74"/>
      <line x1="-88" y1="0" x2="-74" y2="0"/>
    </g>
    <path d="M14 -70 L -34 10 L -4 10 L -16 70 L 36 -14 L 6 -14 Z" fill="#CDFF3A"/>
    <circle r="112" fill="none" stroke="#CDFF3A" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="112;150" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Output stream to the live dashboard -->
  <path d="M712 313 L 790 313" stroke="#CDFF3A" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>
  <path d="M780 303 L 794 313 L 780 323" fill="none" stroke="#CDFF3A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Live dashboard -->
  <g transform="translate(812 193)">
    <rect width="320" height="240" rx="10" fill="#101013" stroke="#2A2A2E" stroke-width="2"/>
    <rect x="22" y="22" width="78" height="26" rx="13" fill="none" stroke="#CDFF3A" stroke-width="2"/>
    <circle cx="40" cy="35" r="6" fill="#FF7A2B">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="52" y="41" font-family="'Space Mono', ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#CDFF3A" letter-spacing="1.5">LIVE</text>
    <rect x="236" y="28" width="62" height="8" rx="4" fill="#2A2A2E"/>
    <rect x="256" y="42" width="42" height="8" rx="4" fill="#232327"/>
    <g stroke="#1C1C20" stroke-width="1.5">
      <line x1="22" y1="110" x2="298" y2="110"/>
      <line x1="22" y1="160" x2="298" y2="160"/>
      <line x1="22" y1="210" x2="298" y2="210"/>
    </g>
    <path d="M22 196 L 62 176 L 98 186 L 134 140 L 170 156 L 206 112 L 242 128 L 278 84 L 298 92 L 298 214 L 22 214 Z" fill="url(#area)"/>
    <path d="M22 196 L 62 176 L 98 186 L 134 140 L 170 156 L 206 112 L 242 128 L 278 84 L 298 92" fill="none" stroke="#CDFF3A" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="298" cy="92" r="7" fill="#CDFF3A"/>
    <circle cx="298" cy="92" r="7" fill="none" stroke="#CDFF3A" stroke-width="2">
      <animate attributeName="r" values="7;18" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
